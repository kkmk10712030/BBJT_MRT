        let userLocation = { lat: 25.0463, lng: 121.5175 };

        async function fetchTDXToken() {
            const tokenUrl = 'https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token';
            const bodyData = new URLSearchParams({
                'grant_type': 'client_credentials',
                'client_id': apiState.clientId,
                'client_secret': apiState.clientSecret
            });

            try {
                let res = await fetch(tokenUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: bodyData
                });
                
                if (res.ok) {
                    const data = await res.json();
                    apiState.accessToken = data.access_token;
                    apiState.tokenExpireTime = Date.now() + (data.expires_in - 60) * 1000;
                    apiState.isRateLimited = false;
                    updateAPIStatusBadge(true, "🟢 TDX API 實時連線中");
                    return true;
                } else if (res.status === 429) {
                    apiState.isRateLimited = true;
                    updateAPIStatusBadge(false, "⚠️ API Rate Limit 額度超限，啟用模擬班次");
                    return false;
                }
            } catch (err) {
                console.warn("Direct Auth failed, trying CORS proxy...", err);
            }

            try {
                let proxyUrl = `https://corsproxy.io/?${encodeURIComponent(tokenUrl)}`;
                let res = await fetch(proxyUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: bodyData
                });
                if (res.ok) {
                    const data = await res.json();
                    apiState.accessToken = data.access_token;
                    apiState.tokenExpireTime = Date.now() + (data.expires_in - 60) * 1000;
                    apiState.isRateLimited = false;
                    updateAPIStatusBadge(true, "🟢 TDX API 實時連線中 (Proxy)");
                    return true;
                }
            } catch (e) {
                console.error("Auth Exception", e);
            }

            apiState.isRateLimited = true;
            updateAPIStatusBadge(false, "🔴 金鑰失效或配額用盡 (請於診斷面板更換 Key)");
            return false;
        }

        async function ensureValidToken() {
            if (!apiState.accessToken || Date.now() >= apiState.tokenExpireTime) {
                return await fetchTDXToken();
            }
            return true;
        }

        async function fetchRealtimeLiveBoard() {
            const hasToken = await ensureValidToken();
            if (!hasToken || apiState.isRateLimited) {
                generateFallbackBoardData();
                renderStationCards();
                return;
            }

            const trtcUrl = 'https://tdx.transportdata.tw/api/basic/v2/Rail/Metro/LiveBoard/TRTC?$format=JSON';
            try {
                let res = await fetch(trtcUrl, { headers: { 'Authorization': `Bearer ${apiState.accessToken}` } });
                
                if (res.status === 429) {
                    apiState.isRateLimited = true;
                    updateAPIStatusBadge(false, "⚠️ API Rate Limit 超限，使用模擬資料");
                    generateFallbackBoardData();
                    renderStationCards();
                    return;
                }

                if (res.ok) {
                    const trtcData = await res.json();
                    liveBoardData = {};
                    const now = Date.now();
                    trtcData.forEach(item => {
                        const stId = item.StationID;
                        const stName = item.StationName?.Zh_tw || stId;
                        if (!liveBoardData[stId]) liveBoardData[stId] = [];
                        if (!liveBoardData[stName]) liveBoardData[stName] = [];

                        let estimateMinutes = item.EstimateTime || 1;
                        let targetTimestamp = now + (estimateMinutes * 60 * 1000);

                        const trainInfo = {
                            destination: item.TripHeadSign || '列車',
                            targetTimestamp: targetTimestamp
                        };
                        liveBoardData[stId].push(trainInfo);
                        liveBoardData[stName].push(trainInfo);
                    });
                    document.getElementById('last-updated-time').innerText = `最後更新: ${new Date().toLocaleTimeString('zh-TW')}`;
                }
            } catch (err) {
                generateFallbackBoardData();
            }
            renderStationCards();
        }

        // 備援預測數據生成器 (防止 API Rate Limit 導致完全空白)
        function generateFallbackBoardData() {
            const now = Date.now();
            STATIONS_DB.forEach(st => {
                liveBoardData[st.id] = [
                    { destination: "端點站 (預估)", targetTimestamp: now + 120000 },
                    { destination: "端點站 (預估)", targetTimestamp: now + 360000 }
                ];
                liveBoardData[st.name] = liveBoardData[st.id];
            });
            document.getElementById('last-updated-time').innerText = `已啟用離線/預測動態`;
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function requestGPSLocation() {
            const statusEl = document.getElementById('location-status-text');
            statusEl.innerText = "取得 GPS 中...";
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        userLocation.lat = pos.coords.latitude;
                        userLocation.lng = pos.coords.longitude;
                        statusEl.innerText = `📍 GPS 定位成功 (${userLocation.lat.toFixed(2)}, ${userLocation.lng.toFixed(2)})`;
                        renderStationCards();
                    },
                    () => {
                        statusEl.innerText = "📍 預設位置 (台北車站)";
                        renderStationCards();
                    }
                );
            }
        }

        function getFilteredStations() {
            const query = document.getElementById('station-search').value.trim().toLowerCase();
            let list = STATIONS_DB.map(st => ({
                ...st,
                distanceKm: calculateDistance(userLocation.lat, userLocation.lng, st.lat, st.lng)
            })).sort((a, b) => a.distanceKm - b.distanceKm);

            if (query) return list.filter(st => st.name.toLowerCase().includes(query) || st.id.toLowerCase().includes(query));
            if (activeLineFilter !== 'ALL') return list.filter(st => st.line === activeLineFilter);
            return list.slice(0, 9);
        }

        function renderStationCards() {
            const container = document.getElementById('stations-grid');
            const stations = getFilteredStations();

            if (stations.length === 0) {
                container.innerHTML = '';
                document.getElementById('empty-state').classList.remove('hidden');
                return;
            }
            document.getElementById('empty-state').classList.add('hidden');

            container.innerHTML = stations.map(st => {
                const lineInfo = LINES[st.line] || LINES.ALL;
                const trains = (liveBoardData[st.id] || []).slice(0, 3);

                let trainsHtml = trains.map(t => {
                    const diffSec = Math.max(0, Math.floor((t.targetTimestamp - Date.now()) / 1000));
                    const mins = Math.floor(diffSec / 60);
                    const secs = diffSec % 60;
                    let badgeBg = 'bg-slate-100 text-slate-700';
                    let timeStr = `${mins}分 ${secs}秒`;

                    if (diffSec <= 30) { badgeBg = 'bg-rose-500 text-white pulse-live'; timeStr = '列車進站中'; }
                    else if (diffSec <= 90) { badgeBg = 'bg-amber-500 text-white'; timeStr = '即將進站'; }

                    return `
                        <div class="flex items-center justify-between p-2.5 bg-slate-50 rounded-xl text-xs border border-slate-100">
                            <span class="font-semibold text-slate-700">往 ${t.destination}</span>
                            <span class="px-2.5 py-1 rounded-lg font-mono text-xs ${badgeBg}">${timeStr}</span>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 hover:shadow-md transition">
                        <div class="flex items-center justify-between mb-3">
                            <div class="flex items-center space-x-2.5">
                                <span class="px-2.5 py-1 rounded-lg text-xs font-black ${lineInfo.badgeClass}">${st.id}</span>
                                <h3 class="text-lg font-bold text-slate-800">${st.name}</h3>
                            </div>
                            <span class="text-xs text-slate-500 bg-slate-100 px-2 py-1 rounded-md">📍 ${st.distanceKm.toFixed(1)} km</span>
                        </div>
                        <div class="space-y-2 mt-4">${trainsHtml}</div>
                    </div>
                `;
            }).join('');
        }

        function renderLineTabs() {
            document.getElementById('line-tabs').innerHTML = Object.keys(LINES).map(key => {
                const isActive = activeLineFilter === key;
                return `
                    <button onclick="switchLineFilter('${key}')" class="px-3.5 py-2 rounded-xl transition flex items-center space-x-1.5 ${isActive ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'}">
                        <span class="w-2.5 h-2.5 rounded-full" style="background-color: ${LINES[key].color}"></span>
                        <span>${LINES[key].name}</span>
                    </button>
                `;
            }).join('');
        }

        function switchLineFilter(key) { activeLineFilter = key; renderLineTabs(); renderStationCards(); }
        function handleSearchInput() { renderStationCards(); }
        function updateAPIStatusBadge(isLive, msg) {
            document.getElementById('api-status-text').innerText = msg;
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        async function testTDXConnection() {
            const logEl = document.getElementById('api-diagnostic-log');
            logEl.innerText = "正在測試金鑰...\n";
            const cid = document.getElementById('input-client-id').value.trim();
            const sec = document.getElementById('input-client-secret').value.trim();

            try {
                let res = await fetch('https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ 'grant_type': 'client_credentials', 'client_id': cid, 'client_secret': sec })
                });
                if (res.ok) logEl.innerText += "🟢 驗證成功！金鑰可正常使用。";
                else if (res.status === 429) logEl.innerText += "🔴 Rate Limit Exceeded: 此 Key 今日請求頻率已超限。";
                else logEl.innerText += `🔴 驗證失敗 (HTTP ${res.status})`;
            } catch(e) {
                logEl.innerText += "⚠️️ 發生網路或 CORS 阻擋錯誤。";
            }
        }

        function saveAPICredentials() {
            localStorage.setItem('tdx_client_id', document.getElementById('input-client-id').value.trim());
            localStorage.setItem('tdx_client_secret', document.getElementById('input-client-secret').value.trim());
            apiState.clientId = localStorage.getItem('tdx_client_id');
            apiState.clientSecret = localStorage.getItem('tdx_client_secret');
            apiState.accessToken = null;
            closeModal('api-config-modal');
            fetchRealtimeLiveBoard();
        }

        window.onload = async function() {
            renderLineTabs();
            requestGPSLocation();
            await fetchRealtimeLiveBoard();
            setInterval(fetchRealtimeLiveBoard, 30000); // 調降輪詢頻率為 30 秒
            setInterval(renderStationCards, 1000);
        };
    </script>
</body>
</html>
